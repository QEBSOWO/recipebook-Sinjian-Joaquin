<!-- ledger/templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>{% block title %}My amazing site{% endblock %}</title>
    {% block styles %}{% endblock %}
</head>
<body>
    <header>
        <h1>Recipe Book</h1>
    </header>

    {% if user.is_authenticated %}
    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Logout</button>
    </form>
    {% else %}
    <a href="{% url 'login' %}">Please log in to access the recipes.</a>
    {% endif %}

    {% block content %}
    {% endblock %}

</body>
</html>
